# ╔══════════════════════════════════════════════════════════╗
# ║           Starship Prompt Configuration                  ║
# ║  Shows: dir · git branch · python env · exit code       ║
# ╚══════════════════════════════════════════════════════════╝
 
# Overall format — 1-line powerline
format = """
[](blue)\
$os\
$username\
$hostname\
[](fg:blue bg:sky)\
$directory\
[](fg:sky bg:green)\
$git_branch\
$git_status\
[](fg:green bg:yellow)\
$python\
[](fg:yellow bg:sapphire)\
$conda\
[](fg:sapphire bg:lavender)\
$cmd_duration\
[ ](fg:lavender)\
$character"""
 
right_format = ""
 
add_newline = true

palette = "catppuccin_mocha"
 
# ─────────────────────────────────────────
# OS icon
# ─────────────────────────────────────────
[os]
disabled = false
style = "bg:blue fg:crust"
format = "[ $symbol ]($style)"
 
[os.symbols]
Linux   = "󰌽"
Ubuntu  = "󰕈"
Debian  = "󰣚"
Arch    = "󰣇"
Fedora  = "󰣛"
Windows = "󰍲"
Macos   = "󰀵"

# ─────────────────────────────────────────
# Catpuccin themes
# ─────────────────────────────────────────
 
[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"

# ─────────────────────────────────────────
# Username
# ─────────────────────────────────────────
[username]
show_always = true
style_user  = "bg:blue fg:crust"
style_root  = "bg:blue fg:red"
format      = "[ $user ]($style)"
 
[hostname]
ssh_only = true
style    = "bg:blue fg:crust"
format   = "[@$hostname ]($style)"
 
# ─────────────────────────────────────────
# Directory
# ─────────────────────────────────────────
[directory]
style            = "bg:sky fg:crust"
read_only        = " 󰌾"
read_only_style  = "bg:sky fg:red"
truncation_length = 4
truncate_to_repo = true
home_symbol      = "~"
format           = "[ $path ]($style)[$read_only]($read_only_style)"
 
[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Desktop"   = " "
"Music"     = " "
"Pictures"  = " "
 
# ─────────────────────────────────────────
# Git
# ─────────────────────────────────────────
[git_branch]
symbol    = ""
style     = "bg:green fg:crust"
format    = "[ $symbol $branch ]($style)"
truncation_length = 20
truncation_symbol = "…"
 
[git_status]
style     = "bg:green fg:crust"
format    = "[($all_status$ahead_behind )]($style)"
conflicted  = "⚡"
ahead       = "⇡${count}"
behind      = "⇣${count}"
diverged    = "⇕⇡${ahead_count}⇣${behind_count}"
up_to_date  = ""
untracked   = "?"
stashed     = "󰏗 "
modified    = "!"
staged      = "+"
renamed     = "»"
deleted     = "✘"
 
# ─────────────────────────────────────────
# Python  (virtualenv / pyenv / conda)
# ─────────────────────────────────────────
[python]
symbol          = ""
style           = "bg:yellow fg:crust"
format          = '[ $symbol $pyenv_prefix($version )(\($virtualenv\) )]($style)'
detect_files    = ["requirements.txt", "setup.py", "setup.cfg", "pyproject.toml", "Pipfile", ".python-version"]
detect_folders  = [".venv", "venv", "__pycache__"]
python_binary   = ["python3", "python"]
 
[conda]
symbol  = " "
style   = "bg:sapphire fg:crust"
format  = "[ $symbol$environment ]($style)"
ignore_base = true
 
# ─────────────────────────────────────────
# Fill (pushes right-side items to the edge)
# ─────────────────────────────────────────
[fill]
symbol = " "
 
# ─────────────────────────────────────────
# Command duration
# ─────────────────────────────────────────
[cmd_duration]
min_time   = 0
style      = "bg:lavender fg:crust"
format     = "[  $duration ]($style)"
 
# ─────────────────────────────────────────
# Time
# ─────────────────────────────────────────
[time]
disabled   = true
style      = "bold fg:#6c7086"
format     = "[$time]($style)"
time_format = "%H:%M"
 
# ─────────────────────────────────────────
# Prompt character
# ─────────────────────────────────────────
[character]
success_symbol = "[ ❯](bold fg:green)"
error_symbol   = "[ ❯](bold fg:red)"
vimcmd_symbol  = "[ ❮](bold fg:blue)"
 
# ─────────────────────────────────────────
# Node / others (disabled to keep it clean)
# ─────────────────────────────────────────
[nodejs]
disabled = true
 
[ruby]
disabled = true
 
[java]
disabled = true
 
[package]
disabled = true
